<!DOCTYPE html>
<html lang = "fr">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content = "width = devide-width, initial-scale=1.0">
    <title>MiniForum - Inscription</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class = "entete">
        <img src = "images/logo.svg" alt = "logo" style="width: 80px; height: 80px;">
        <h1> MiniForum</h1>
        <nav>
            <ul>
               <li><a href = "index.html">Accueil</a></li>
               <li><a href="sujets.html">Sujets</a></li>
               <li><a href = "connexion.html">Connexion</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Créer un compte</h2>
        <form action ="/inscription" method = "post">
            <fieldset>
                <legend>Identifiants</legend>
                <label for="pseudo"> Pseudo</label>
                <input type="text" id ="pseudo" name ="pseudo" 
                pattern ="[A-Z a-z 0-9]{3,15}"
                title = "3 à 15 caractères : lettres et chiffres uniquement"
                required>
                <label for="email">Adresse e-mail</label>
                <input type ="email" id ="email" name ="email" required>
                <label for ="password">Mot de passe</label>
                <input type = "password" id ="password" name = "password" required minlength="8">
                <label for ="naissance">Date de naissance</label>
                <input type ="date" id ="naissance" name ="naissance">
            </fieldset>
            <fieldset>
                <legend>Préférence</legend>
                <input class = "option" type ="checkbox" id = "newsletter" name ="newsletter">
                <label for ="newsletter">Recevoir newsletters</label>
                <input class = "option" type = "checkbox" id ="cgu" name ="cgu" required>
                <label for ="cgu">J'accepte les conditions générales d'utilisation</label>
                <button class = "bouton" type ="submit">Créer mon compte</button>
            </fieldset>
        </form>
    </main>

    <footer class = "pied">
       <p>MiniForum</p>
       <p> Classe passerelle cfpt·i </p>
    </footer>
</body>
</html>
